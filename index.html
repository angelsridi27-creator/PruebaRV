<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA - Cuadrilla</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
    select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    select:disabled { background-color: #e9ecef; color: #999; }
  </style>
</head>
<body>

<div class="card">
  <h2>Reporte de Campo</h2>

  <form id="formReporte">
    <!-- 1. Menú de Divisiones con las 4 opciones solicitadas -->
    <div class="form-group">
      <label for="selectDivision">División:</label>
      <select id="selectDivision" onchange="actualizarResponsables()">
        <option value="">-- Seleccionar División --</option>
        <option value="Cordoba">Córdoba (Columna C)</option>
        <option value="Reolin">Reolín (Columna D)</option>
        <option value="Isla Verde">Isla Verde (Columna E)</option>
        <option value="Levalle">Levalle (Columna F)</option>
      </select>
    </div>

    <!-- 2. Menú de Responsable Técnico -->
    <div class="form-group">
      <label for="selectResponsable">Responsable Técnico:</label>
      <select id="selectResponsable" disabled>
        <option value="">-- Primero seleccione una División --</option>
      </select>
    </div>
  </form>
</div>

<script>
  // Variable global para guardar los datos cargados desde la hoja "Lineas"
  let datosResponsables = {};

  document.addEventListener("DOMContentLoaded", () => {
    // Pedir los datos a Google Apps Script al iniciar
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(alCargarDatos)
        .obtenerResponsablesPorDivision();
    }
  });

  function alCargarDatos(datos) {
    datosResponsables = datos;
    
    // Si había una división guardada previamente en este celular, la seleccionamos
    const ultimaDiv = localStorage.getItem("pwa_division_guardada");
    if (ultimaDiv) {
      document.getElementById("selectDivision").value = ultimaDiv;
      actualizarResponsables();
    }
  }

  function actualizarResponsables() {
    const selectDiv = document.getElementById("selectDivision");
    const selectResp = document.getElementById("selectResponsable");
    const divisionElegida = selectDiv.value;

    selectResp.innerHTML = '';

    if (divisionElegida && datosResponsables[divisionElegida]) {
      // Guardar elección en el dispositivo
      localStorage.setItem("pwa_division_guardada", divisionElegida);

      selectResp.disabled = false;
      
      const optDefault = document.createElement("option");
      optDefault.value = "";
      optDefault.textContent = "-- Seleccionar Responsable --";
      selectResp.appendChild(optDefault);

      // Cargar únicamente la lista de la columna correspondiente
      datosResponsables[divisionElegida].forEach(nombre => {
        const opt = document.createElement("option");
        opt.value = nombre;
        opt.textContent = nombre;
        selectResp.appendChild(opt);
      });

    } else {
      selectResp.disabled = true;
      const optDefault = document.createElement("option");
      optDefault.value = "";
      optDefault.textContent = "-- Primero seleccione una División --";
      selectResp.appendChild(optDefault);
      localStorage.removeItem("pwa_division_guardada");
    }
  }
</script>

</body>
</html>
